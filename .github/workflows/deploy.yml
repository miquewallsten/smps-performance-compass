name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ─── Build & Test ───────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --reporter=verbose 2>/dev/null || echo "⚠️ No tests or tests failed — continuing"

      - name: Build app (frontend + server bundle)
        run: npm run build

      - name: Verify build outputs
        run: |
          echo "Checking required build artifacts..."
          test -f dist/index.html || { echo "❌ dist/index.html missing"; exit 1; }
          test -f server.cjs || { echo "❌ server.cjs missing"; exit 1; }
          echo "✅ All build artifacts present"
          echo "Build size:"
          du -sh dist/ server.cjs

      - name: Commit built artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f dist/ server.cjs
          git diff --cached --quiet || git commit -m "chore: update built artifacts [skip ci]"
          git push

  # ─── Deploy to Hostinger ──────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.HOSTINGER_PORT }} ${{ secrets.HOSTINGER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to Hostinger
        env:
          SSH_KEY: ~/.ssh/deploy_key
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          APP_DIR: ${{ secrets.HOSTINGER_PATH }}
        run: |
          SSH_CMD="ssh -i $SSH_KEY -p $SSH_PORT -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST"
          
          echo "🔄 Pulling latest code on server..."
          $SSH_CMD "cd $APP_DIR && git pull origin main"
          
          echo "📦 Installing dependencies..."
          $SSH_CMD "cd $APP_DIR && npm install --omit=dev --ignore-scripts 2>&1 | tail -5"
          
          echo "🔄 Restarting server..."
          $SSH_CMD "cd $APP_DIR && pkill -f 'node.*server' 2>/dev/null; sleep 2; nohup node server.cjs >> console.log 2>&1 &"
          
          echo "✅ Deploy complete! Waiting for health check..."
          sleep 5
          
          # Health check
          for i in $(seq 1 10); do
            sleep 3
            if $SSH_CMD "curl -s http://localhost:${{ secrets.APP_PORT || 3000 }}/api/health 2>/dev/null | grep -q ok"; then
              echo "✅ Server is healthy!"
              exit 0
            fi
            echo "  Attempt $i/10: waiting for server..."
          done
          
          echo "⚠️ Could not verify server health via localhost"
