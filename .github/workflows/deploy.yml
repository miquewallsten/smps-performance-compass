name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ─── Build & Test ───────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --reporter=verbose 2>/dev/null || echo "⚠️ No tests or tests failed — continuing"

      - name: Build app (frontend + server bundle)
        run: npm run build

      - name: Verify build outputs
        run: |
          test -f dist/index.html || { echo "❌ dist/index.html missing"; exit 1; }
          test -f server.cjs || { echo "❌ server.cjs missing"; exit 1; }
          echo "✅ Build OK"
          du -sh dist/ server.cjs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            server.cjs
          retention-days: 1

  # ─── Deploy to Hostinger (only on push to main) ──────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Deploy via SSH
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy_key
          sed -i 's/\r$//' ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if ! ssh-keygen -l -f ~/.ssh/deploy_key 2>/dev/null; then
            echo "❌ SSH key format error"
            exit 1
          fi

          ssh-keyscan -p ${{ secrets.HOSTINGER_PORT }} ${{ secrets.HOSTINGER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

          SSH_KEY="~/.ssh/deploy_key"
          SSH_HOST="${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}"
          SSH_PORT="${{ secrets.HOSTINGER_PORT }}"
          REMOTE="${{ secrets.HOSTINGER_PATH }}"
          SSH_CMD="ssh -i $SSH_KEY -p $SSH_PORT -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15 $SSH_HOST"
          SCP_CMD="scp -i $SSH_KEY -P $SSH_PORT -o StrictHostKeyChecking=no -o ConnectTimeout=30"
          HOSTINGER_ENV='export PATH="/opt/alt/alt-nodejs22/root/usr/bin:/usr/local/bin:/usr/bin:/bin:$PATH"'

          echo "🔄 Deploying to Hostinger..."

          # Debug: verify local files
          echo "📁 Local dist/ contents:"
          ls -la dist/ | head -10
          echo "📁 Local dist/assets/ count:"
          ls dist/assets/ | wc -l
          echo "📄 Local dist/index.html:"
          ls -la dist/index.html
          echo "📦 Local server.cjs:"
          ls -la server.cjs

          # 1. Pull latest source code on server
          $SSH_CMD "cd $REMOTE && git checkout -- . && git pull origin main" || true

          # 2. Upload entire dist/ as a tar archive (most reliable)
          echo "📦 Creating dist.tar.gz..."
          tar -czf /tmp/dist.tar.gz -C dist .
          ls -la /tmp/dist.tar.gz
          $SSH_CMD "mkdir -p $REMOTE/dist-new"
          $SCP_CMD /tmp/dist.tar.gz $SSH_HOST:$REMOTE/dist-new/dist.tar.gz
          $SSH_CMD "cd $REMOTE/dist-new && tar -xzf dist.tar.gz && rm dist.tar.gz && ls -la assets/ | head -5"
          $SCP_CMD server.cjs $SSH_HOST:$REMOTE/server.cjs

          # 3. Atomically swap old dist for new dist
          echo "🔄 Swapping dist directories..."
          $SSH_CMD "cd $REMOTE && rm -rf dist-old 2>/dev/null; mv dist dist-old 2>/dev/null || true; mv dist-new dist"
          # Remove any .htaccess that may cause 500 errors
          $SSH_CMD "rm -f $REMOTE/.htaccess" || true

          # 4. Verify the new assets are in place
          echo "🔍 Verifying deploy..."
          ASSET_COUNT=$($SSH_CMD "ls $REMOTE/dist/assets/*.js 2>/dev/null | wc -l")
          if [ "$ASSET_COUNT" -eq 0 ]; then
            echo "❌ Deploy verification failed: no JS assets found in dist/assets"
            echo "🔄 Rolling back..."
            $SSH_CMD "cd $REMOTE && rm -rf dist && mv dist-old dist"
            exit 1
          fi
          echo "✅ $ASSET_COUNT JS assets verified"

          # 5. Clean up old dist after successful deploy
          $SSH_CMD "rm -rf $REMOTE/dist-old"

          # 6. Install production deps and restart Passenger
          $SSH_CMD "cd $REMOTE && $HOSTINGER_ENV && npm install --omit=dev --ignore-scripts 2>&1 | tail -5; mkdir -p tmp; touch tmp/restart.txt; echo '✅ Passenger restart triggered'"

          echo "✅ Deploy complete!"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
