name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.HOSTINGER_PORT }} ${{ secrets.HOSTINGER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload built files
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p ${{ secrets.HOSTINGER_PORT }} -o StrictHostKeyChecking=no ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}"
          SCP="scp -i ~/.ssh/deploy_key -P ${{ secrets.HOSTINGER_PORT }} -o StrictHostKeyChecking=no"
          REMOTE="${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.HOSTINGER_PATH }}"
          
          echo "Uploading server.cjs..."
          $SCP server.cjs $REMOTE/server.cjs
          
          echo "Uploading dist/..."
          $SCP dist/index.html $REMOTE/dist/index.html
          $SCP dist/assets/index-*.js $REMOTE/dist/assets/
          $SCP dist/assets/index-*.css $REMOTE/dist/assets/
          $SCP dist/assets/xlsx-*.js $REMOTE/dist/assets/ 2>/dev/null || true
          
          echo "Uploading source files..."
          $SCP -r server/ $REMOTE/server/
          $SCP -r src/ $REMOTE/src/

      - name: Restart server
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.HOSTINGER_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }} \
            "cd ${{ secrets.HOSTINGER_PATH }} && pkill -f 'node.*server' 2>/dev/null; sleep 2; nohup bash start.sh > console.log 2>&1 & sleep 3; curl -s http://localhost:3000/api/health"

      - name: Verify deployment
        run: |
          sleep 2
          HEALTH=$(curl -s https://bowdot.online/api/health)
          echo "Health check: $HEALTH"
          echo "$HEALTH" | grep -q '"status":"ok"' && echo "✅ Deployment successful!" || echo "❌ Deployment may have issues"
