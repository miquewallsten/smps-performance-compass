name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ─── Build & Test ───────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --reporter=verbose 2>/dev/null || echo "⚠️ No tests or tests failed — continuing"

      - name: Build app (frontend + server bundle)
        run: npm run build

      - name: Verify build outputs
        run: |
          test -f dist/index.html || { echo "❌ dist/index.html missing"; exit 1; }
          test -f server.cjs || { echo "❌ server.cjs missing"; exit 1; }
          echo "✅ Build OK"
          du -sh dist/ server.cjs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            server.cjs
          retention-days: 1

  # ─── Deploy to Hostinger (only on push to main) ──────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Deploy via SSH
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy_key
          sed -i 's/\r$//' ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if ! ssh-keygen -l -f ~/.ssh/deploy_key 2>/dev/null; then
            echo "❌ SSH key format error"
            exit 1
          fi

          ssh-keyscan -p ${{ secrets.HOSTINGER_PORT }} ${{ secrets.HOSTINGER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

          SSH_KEY="$HOME/.ssh/deploy_key"
          SSH_HOST="${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}"
          SSH_PORT="${{ secrets.HOSTINGER_PORT }}"
          REMOTE="${{ secrets.HOSTINGER_PATH }}"
          SSH_CMD="ssh -i $SSH_KEY -p $SSH_PORT -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15 $SSH_HOST"
          SCP_CMD="scp -i $SSH_KEY -P $SSH_PORT -o StrictHostKeyChecking=no -o ConnectTimeout=30"
          HOSTINGER_ENV='export PATH="/opt/alt/alt-nodejs24/root/usr/bin:/usr/local/bin:/usr/bin:/bin:$PATH"'

          echo "🔄 Deploying to Hostinger..."
          echo "SSH_HOST=$SSH_HOST"
          echo "SSH_PORT=$SSH_PORT"
          echo "REMOTE=$REMOTE"
          echo "Testing SSH connection..."
          $SSH_CMD "echo 'SSH connection successful'" || { echo "❌ SSH connection failed"; exit 1; }

          # 1. Pull latest source code on server
          echo "📦 Step 1: Pulling latest code..."
          $SSH_CMD "cd $REMOTE && git checkout -- . && git pull origin main 2>&1" || echo "⚠️ Git pull failed, continuing with upload"

          # 2. Clean old build artifacts on server
          echo "🧹 Step 2: Cleaning old artifacts..."
          $SSH_CMD "rm -rf $REMOTE/dist/assets $REMOTE/dist/index.html $REMOTE/dist/favicon.ico $REMOTE/dist/robots.txt 2>&1" || true
          $SSH_CMD "rm -f $REMOTE/.htaccess 2>&1" || true

          # 3. Upload new build artifacts
          # CRITICAL: Upload assets BEFORE index.html to avoid serving
          # a new index.html that references assets that don't exist yet
          echo "📤 Step 3: Uploading build artifacts..."
          echo "Creating remote directory..."
          $SSH_CMD "mkdir -p $REMOTE/dist/assets" || { echo "❌ Failed to create remote directory"; exit 1; }

          echo "  - Creating assets tarball..."
          tar -czf /tmp/assets.tar.gz -C dist/assets . || { echo "❌ Failed to create tarball"; exit 1; }

          echo "  - Uploading assets.tar.gz..."
          $SCP_CMD /tmp/assets.tar.gz $SSH_HOST:$REMOTE/dist/assets/assets.tar.gz || { echo "❌ Failed to upload assets"; exit 1; }

          echo "  - Extracting assets on server..."
          $SSH_CMD "cd $REMOTE/dist/assets && tar -xzf assets.tar.gz && rm assets.tar.gz 2>&1" || { echo "❌ Failed to extract assets"; exit 1; }

          echo "  - Verifying assets exist..."
          $SSH_CMD "ls $REMOTE/dist/assets/ | head -5" || { echo "❌ Assets directory empty"; exit 1; }

          # Upload index.html AFTER assets are in place
          echo "  - Uploading dist/index.html..."
          $SCP_CMD dist/index.html $SSH_HOST:$REMOTE/dist/index.html || { echo "❌ Failed to upload index.html"; exit 1; }

          echo "  - Uploading dist/favicon.ico..."
          $SCP_CMD dist/favicon.ico $SSH_HOST:$REMOTE/dist/favicon.ico 2>/dev/null || echo "⚠️ favicon.ico not found"

          echo "  - Uploading dist/robots.txt..."
          $SCP_CMD dist/robots.txt $SSH_HOST:$REMOTE/dist/robots.txt 2>/dev/null || echo "⚠️ robots.txt not found"

          echo "  - Uploading server.cjs..."
          $SCP_CMD server.cjs $SSH_HOST:$REMOTE/server.cjs || { echo "❌ Failed to upload server.cjs"; exit 1; }

          # 4. Install production deps and restart Passenger
          echo "📦 Step 4: Installing dependencies and restarting..."
          echo "  - Running npm install..."
          $SSH_CMD "cd $REMOTE && $HOSTINGER_ENV && npm install --omit=dev --ignore-scripts 2>&1 | tail -5" || echo "⚠️ npm install had warnings"

          echo "  - Triggering Passenger restart..."
          $SSH_CMD "cd $REMOTE && mkdir -p tmp && touch tmp/restart.txt 2>&1" || { echo "❌ Failed to restart Passenger"; exit 1; }

          echo "✅ Deploy complete!"

