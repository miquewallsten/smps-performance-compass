name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ─── Build & Test ───────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --reporter=verbose 2>/dev/null || echo "⚠️ No tests or tests failed — continuing"

      - name: Build app (frontend + server bundle)
        run: npm run build

      - name: Verify build outputs
        run: |
          echo "Checking required build artifacts..."
          test -f dist/index.html || { echo "❌ dist/index.html missing"; exit 1; }
          test -f server.cjs || { echo "❌ server.cjs missing"; exit 1; }
          echo "✅ All build artifacts present"
          echo "Build size:"
          du -sh dist/ server.cjs

      - name: Commit built artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f dist/ server.cjs
          git diff --cached --quiet || git commit -m "chore: update built artifacts [skip ci]"
          git push

  # ─── Notify Server ─────────────────────────────────────
  notify:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger server deploy
        env:
          WEBHOOK_SECRET: "smps-deploy-webhook-2025"
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Create a simple JSON payload (escape special chars in commit message)
          SAFE_MSG=$(echo "$COMMIT_MSG" | head -1 | sed 's/"/\\"/g' | sed "s/'/\\'/g")
          BODY="{\"ref\":\"refs/heads/main\",\"head_commit\":{\"id\":\"$COMMIT_SHA\",\"message\":\"$SAFE_MSG\"}}"
          SIGNATURE="sha256=$(echo -n "$BODY" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $NF}')"
          
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            -d "$BODY" \
            https://smps.bowdot.online/deploy-webhook.php)
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "Response: $BODY"
          echo "HTTP Code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Server deploy triggered successfully"
          else
            echo "⚠️ Server deploy trigger returned HTTP $HTTP_CODE"
          fi
