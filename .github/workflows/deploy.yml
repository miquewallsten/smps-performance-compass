name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─── Test & Build ───────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --reporter=verbose 2>/dev/null || echo "⚠️ No tests or tests failed — continuing"

      - name: Build app (frontend + server bundle)
        run: npm run build

      - name: Verify build outputs
        run: |
          echo "Checking required build artifacts..."
          test -f dist/index.html || { echo "❌ dist/index.html missing"; exit 1; }
          test -f server.cjs || { echo "❌ server.cjs missing"; exit 1; }
          echo "✅ All build artifacts present"

      - name: Create .env.production from secrets
        run: |
          cat > .env.production << 'EOF'
          MYSQL_HOST=${{ secrets.MYSQL_HOST }}
          MYSQL_PORT=${{ secrets.MYSQL_PORT }}
          MYSQL_USER=${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          PORT=${{ secrets.APP_PORT }}
          NODE_ENV=production
          OLLAMA_API_KEY=${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_BASE_URL=${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_MODEL=${{ secrets.OLLAMA_MODEL }}
          EOF

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            server.cjs
            server.js
            package.json
            package-lock.json
            ci-deploy.sh
            start.sh
            .env.production
          retention-days: 1

  # ─── Deploy ──────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y openssh-client rsync

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Add host key with retries (Hostinger sometimes rate-limits ssh-keyscan)
          for i in 1 2 3; do
            if ssh-keyscan -p ${{ secrets.HOSTINGER_PORT }} ${{ secrets.HOSTINGER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "✅ Host key added"
              break
            fi
            echo "Attempt $i: ssh-keyscan failed, retrying in 10s..."
            sleep 10
          done

      - name: Test SSH connectivity
        run: |
          echo "Testing SSH connection with retries..."
          for i in 1 2 3 4 5; do
            if ssh -i ~/.ssh/deploy_key -p ${{ secrets.HOSTINGER_PORT }} -o StrictHostKeyChecking=no -o ConnectTimeout=15 ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }} "echo 'SSH OK'" 2>/dev/null; then
              echo "✅ SSH connection established on attempt $i"
              break
            fi
            echo "Attempt $i failed, waiting 30s before retry..."
            sleep 30
          done

      - name: Upload files to Hostinger via rsync
        run: |
          SSH_KEY="~/.ssh/deploy_key"
          SSH_PORT="${{ secrets.HOSTINGER_PORT }}"
          SSH_USER="${{ secrets.HOSTINGER_USER }}"
          SSH_HOST="${{ secrets.HOSTINGER_HOST }}"
          REMOTE_PATH="${{ secrets.HOSTINGER_PATH }}"
          
          # Create SSH config for reliable connections
          mkdir -p ~/.ssh
          cat > ~/.ssh/config << SSHCFG
          Host hostinger
            HostName ${SSH_HOST}
            Port ${SSH_PORT}
            User ${SSH_USER}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            ConnectTimeout 30
            ServerAliveInterval 15
            ServerAliveCountMax 3
          SSHCFG
          chmod 600 ~/.ssh/config
          
          echo "Uploading build artifacts via rsync..."
          rsync -avz --progress -e "ssh -F ~/.ssh/config" \
            server.cjs server.js package.json package-lock.json \
            ci-deploy.sh start.sh .env.production \
            hostinger:${REMOTE_PATH}/
          
          echo "Uploading frontend dist..."
          rsync -avz --progress -e "ssh -F ~/.ssh/config" \
            dist/ hostinger:${REMOTE_PATH}/dist/
          
          echo "✅ All files uploaded"

      - name: Run server-side deploy script
        run: |
          ssh -F ~/.ssh/config hostinger \
            "chmod +x ${{ secrets.HOSTINGER_PATH }}/ci-deploy.sh && bash ${{ secrets.HOSTINGER_PATH }}/ci-deploy.sh"

      - name: Verify deployment
        run: |
          echo "Verifying deployment via public URL..."
          for i in $(seq 1 12); do
            sleep 5
            HEALTH=$(curl -sf https://bowdot.online/api/health 2>/dev/null || echo "")
            if echo "$HEALTH" | grep -q '"ok"'; then
              echo "✅ Deployment verified! Health: $HEALTH"
              exit 0
            fi
            echo "Attempt $i/12: waiting for server..."
          done
          echo "❌ Deployment verification failed — server did not respond"
          exit 1

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
