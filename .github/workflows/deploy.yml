name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Add host key to known_hosts
          ssh-keyscan -p ${{ secrets.HOSTINGER_PORT }} ${{ secrets.HOSTINGER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          # Test SSH connection
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.HOSTINGER_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }} "echo SSH OK"

      - name: Upload built files
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -p ${{ secrets.HOSTINGER_PORT }} -o StrictHostKeyChecking=no"
          SCP_OPTS="-i ~/.ssh/deploy_key -P ${{ secrets.HOSTINGER_PORT }} -o StrictHostKeyChecking=no"
          REMOTE="${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}"
          PATH="${{ secrets.HOSTINGER_PATH }}"
          
          echo "Uploading server.cjs..."
          scp $SCP_OPTS server.cjs $REMOTE:$PATH/server.cjs
          
          echo "Uploading dist/..."
          scp $SCP_OPTS dist/index.html $REMOTE:$PATH/dist/index.html
          scp $SCP_OPTS dist/assets/index-*.js $REMOTE:$PATH/dist/assets/
          scp $SCP_OPTS dist/assets/index-*.css $REMOTE:$PATH/dist/assets/
          scp $SCP_OPTS dist/assets/xlsx-*.js $REMOTE:$PATH/dist/assets/ 2>/dev/null || true
          
          echo "Uploading source files..."
          scp $SCP_OPTS -r server/ $REMOTE:$PATH/server/
          scp $SCP_OPTS -r src/ $REMOTE:$PATH/src/

      - name: Restart server
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.HOSTINGER_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }} \
            "cd ${{ secrets.HOSTINGER_PATH }} && pkill -f 'node.*server.cjs' 2>/dev/null; sleep 2; nohup bash start.sh > console.log 2>&1 &"

      - name: Wait and verify
        run: |
          sleep 5
          for i in 1 2 3; do
            HEALTH=$(curl -s https://bowdot.online/api/health 2>/dev/null)
            if echo "$HEALTH" | grep -q '"ok"'; then
              echo "✅ Deployment successful! Health: $HEALTH"
              exit 0
            fi
            echo "Attempt $i: waiting for server..."
            sleep 5
          done
          echo "❌ Deployment may have issues"
          exit 1
