name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.HOSTINGER_PORT }} ${{ secrets.HOSTINGER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.HOSTINGER_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }} "echo 'SSH connection OK'"

      - name: Upload built files
        run: |
          SCP="scp -i ~/.ssh/deploy_key -P ${{ secrets.HOSTINGER_PORT }} -o StrictHostKeyChecking=no"
          REMOTE="${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.HOSTINGER_PATH }}"
          
          echo "Uploading server.cjs..."
          $SCP server.cjs $REMOTE/server.cjs
          
          echo "Uploading dist/..."
          $SCP dist/index.html $REMOTE/dist/index.html
          $SCP dist/assets/index-*.js $REMOTE/dist/assets/
          $SCP dist/assets/index-*.css $REMOTE/dist/assets/
          $SCP dist/assets/xlsx-*.js $REMOTE/dist/assets/ 2>/dev/null || true
          
          echo "Uploading source files..."
          $SCP -r server/ $REMOTE/server/
          $SCP -r src/ $REMOTE/src/

      - name: Restart server
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.HOSTINGER_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }} \
            "cd ${{ secrets.HOSTINGER_PATH }} && pkill -f 'node.*server.cjs' 2>/dev/null; sleep 2; nohup bash start.sh > console.log 2>&1 &"

      - name: Wait and verify
        run: |
          sleep 8
          for i in 1 2 3 4 5; do
            HEALTH=$(curl -s https://bowdot.online/api/health 2>/dev/null)
            if echo "$HEALTH" | grep -q '"ok"'; then
              echo "✅ Deployment successful! Health: $HEALTH"
              exit 0
            fi
            echo "Attempt $i: waiting for server..."
            sleep 5
          done
          echo "❌ Deployment may have issues"
          curl -s https://bowdot.online/api/health || echo "Server not responding"
          exit 1
