name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Build & Test ───────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --reporter=verbose 2>/dev/null || echo "⚠️ No tests or tests failed — continuing"

      - name: Build app (frontend + server bundle)
        run: npm run build

      - name: Verify build outputs
        run: |
          echo "Checking required build artifacts..."
          test -f dist/index.html || { echo "❌ dist/index.html missing"; exit 1; }
          test -f server.cjs || { echo "❌ server.cjs missing"; exit 1; }
          echo "✅ All build artifacts present"
          echo "Build size:"
          du -sh dist/ server.cjs

      - name: Upload build artifacts (for debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug
          path: |
            dist/
            server.cjs
          retention-days: 3
