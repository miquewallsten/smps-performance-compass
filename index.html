<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1e293b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>SMPS</title>
    <meta name="description" content="Sistema de Evaluación de Desempeño SMPS" />
    <meta name="author" content="Bowdot" />
    <meta property="og:title" content="SMPS" />
    <meta property="og:description" content="Sistema de Evaluación de Desempeño SMPS" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://smps.bowdot.online" />
    <link rel="dns-prefetch" href="https://smps.bowdot.online" />
    <style>
      /* Loading spinner shown immediately while JS bundle loads */
      #loading-spinner {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1e2940, #2d3a52);
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      #loading-spinner.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #loading-spinner .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255,255,255,0.2);
        border-top-color: #e11d48;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #loading-spinner .label {
        color: rgba(255,255,255,0.7);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        margin-top: 16px;
        letter-spacing: 1px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="loading-spinner">
        <div style="display:flex;flex-direction:column;align-items:center;">
          <div class="spinner"></div>
          <div class="label">Cargando SMPS…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
